# pip 镜像源配置 —— start.sh / start.ps1 会读取本文件。
# 把 active 改成下面 sources 里任一 key 即可切换；default 表示官方 PyPI。
# 详细说明见 docs/pip-mirrors.md。
active = "aliyun"

[sources.default]
name = "PyPI 官方"
url = "https://pypi.org/simple"

[sources.aliyun]
name = "阿里云"
url = "https://mirrors.aliyun.com/pypi/simple/"

[sources.tsinghua]
name = "清华大学"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[sources.ustc]
name = "中国科学技术大学"
url = "https://pypi.mirrors.ustc.edu.cn/simple/"

[sources.huawei]
name = "华为云"
url = "https://repo.huaweicloud.com/repository/pypi/simple"

[sources.tencent]
name = "腾讯云"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
