[metadata]
name = soinsight
version = 2.0.0.dev0
description = Modular CLI toolbox for Linux and Android ELF analysis
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    PyYAML>=5.4

[options.packages.find]
where = src
include = soinsight*

[options.entry_points]
console_scripts =
    soinsight = soinsight.cli.main:main

[options.extras_require]
dev =
    pytest>=8
legacy =
    termcolor
